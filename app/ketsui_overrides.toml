# Ketsui-specific analysis corrections for the code generator (default.xex).
#
# Every entry needs its evidence (which tool or which log found it).

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). Recompiled as plain calls, a longjmp would
# restore r1/r31 from the jmp_buf and then return to its own caller with a foreign stack frame; with the addresses the
# generator emits host setjmp/longjmp keyed by the guest jmp_buf. Found 2026-10-26 by Guwange's pair (0x823EBB30 /
# 0x823EB810, the same CRT) matched with its immediates masked (scratchpad find_pattern.py, 24 words, one match each):
#   setjmp  0x82CCCD80: the hook word (lis r4,0x832F; lwz r0,-0x3EC0(r4); bnectr), then mflr, mfcr, stfd f14,0(r3)
#   longjmp 0x82CCC940: mr r6,r4, the SEH registration check at +312 (lwz r0,0x138(r3))
# 25 direct calls in the game code.
setjmp_address = 0x82CCCD80
longjmp_address = 0x82CCC940

[functions]
# Functions the discovery missed (first codegen, 2026-10-26: "UnresolvedCall ... target not in any function"):
# 0x82C6B120, tail-called from 0x829E0DD8: a COM-style forwarder (cmplwi cr6,r3,0; a null object returns E_INVALIDARG,
# lis/ori 0x80070057, blr; otherwise lwz r11,0(r3) / lwz r11,72(r11) / bctr: the object's vtable slot 18), the same shape
# as its neighbour at 0x82C6B0F8 (slot 17), ending at the bctr at 0x82C6B140.
"0x82C6B120" = { size = 0x24 }
# 0x82BEB468, tail-called from the adjustor thunk at 0x82BEB470: an adjustor thunk itself (addi r3,r3,8; b 0x82BE9D38),
# between the thunks at 0x82BEB460 and 0x82BEB470.
"0x82BEB468" = { size = 0x8 }

