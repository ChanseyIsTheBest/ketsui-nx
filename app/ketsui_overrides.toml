# ketsui-nx (2026-10-27, ketsui_worker_idle_sleep): the top of Ketsui's task-thread loop (sub_829E0400, loc_829E0430:
# `lwzx r11,r31,r28`, the task's pause flag). src/cpu/ketsui_worker_idle.cpp sleeps 1 ms there while the flag is set;
# the loop's own test then runs as before.
[[midasm_hook]]
name = "KetsuiTaskPauseHook"
address = 0x829E0430
registers = ["r28", "r31"]
