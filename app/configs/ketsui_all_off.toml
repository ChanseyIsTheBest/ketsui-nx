# Ketsui (Switch) - TEST: every enhancement off (both masters), log on
# Written by tools/make_ketsui_configs.py: copy it to sdmc:/switch/ketsui-nx/ as ketsui.toml (the game reads only
# that name). The startup log line "[enhancements]" says which enhancements were active.

log_level = "info"
log_to_file = true  # the release writes no log (its built-in settings)
renut_gpu_profile = 10  # Renut renderer: GPU time per frame by kind of work, every 10 s
ketsui_cpu_enhancements = false
ketsui_noncpu_enhancements = false


# Ketsui for the Switch: your options. Every other setting is built into the NRO
# (app/ketsui_switch_defaults.toml); a key added here overrides it.

# Face buttons by position, as on an Xbox pad (bottom = A).  false = by letter.
input_xbox_layout = true

# Single Joy-Cons are held sideways, one per player.
input_joycon_sideways = true

# Button mapping for each player: the Switch buttons that press each Xbox button. Empty = default.
# Buttons: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK UP DOWN LEFT RIGHT SL SR NONE. Example: a = "B, ZR"

[input_p1]
a = ""
b = ""
x = ""
y = ""
lb = ""
rb = ""
lt = ""
rt = ""
start = ""
back = ""
ls = ""
rs = ""
up = ""
down = ""
left = ""
right = ""

[input_p2]
